<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c10">
<title>TradeUp — концепт «Ежедневный бонус» v2</title>
<style>
/* Концепт улучшенной карточки ежедневного бонуса (вкладка «Меню»).
   Один файл, картинки — data URI (в игре: img/daily-gift-dark.png и
   img/daily-gift-light.png). Цвета — переменные тем игры. --k — множитель
   длительности анимаций (кнопка «Замедлить»).

   Что нового относительно текущей карточки:
   1. Фон карточки не пустой: за шапкой стоят два подарка (белый и чёрный),
      наклонённые и притушенные, плюс золотое свечение и мерцающие искры.
   2. В плитках недели — подарки вместо пунктирных кружков: прошедшие дни —
      белый подарок с золотой галочкой, сегодня — светящийся белый подарок,
      будущие — чёрный подарок с замком. День максимума помечен «МАКС».
   3. Полоса серии «до максимума» — видно, сколько дней до $1 500.
   4. Кнопка с суммой и бликом; при получении подарок в шапке открывается,
      монеты вылетают, сумма докручивается, плитка «штампуется».
   5. После получения — кольцо-таймер до завтра и сумма завтрашнего бонуса;
      если серия под угрозой — предупреждение. */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: #050608; color: #e9ecf2; -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 20px 12px 40px;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
img { display: block; }
.mono { font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }

/* ---------------- Темы игры ---------------- */
.screen, .screen[data-theme="dark"] {
  --bg: #0a0c10; --card: #12161d; --card2: #0d1015; --border: #222a36;
  --text: #f2f4f8; --muted: #98a2b3; --gold: #e9b640; --gold-soft: rgba(233, 182, 64, 0.14);
  --gold-grad: linear-gradient(135deg, #f7d879 0%, #e9b640 45%, #c98f1b 100%);
  --gold-border: rgba(233, 182, 64, 0.32); --primary-text: #221703; --track: rgba(152, 162, 179, 0.16);
  --down: #f0524f; --down-dim: rgba(240, 82, 79, 0.14);
  --card-shadow: 0 10px 30px -18px rgba(0, 0, 0, 0.8);
  --sheen: linear-gradient(180deg, rgba(255, 255, 255, 0.028), transparent 42%);
  --glow: radial-gradient(900px 420px at 50% -8%, rgba(233, 182, 64, 0.08), transparent 60%);
  --bg-gift-a: 0.34; --bg-gift-b: 0.6; --tile-gift: 0.42;
}
.screen[data-theme="midnight"] { --bg: #070b16; --card: #0d1322; --card2: #0a0f1c; --border: #1e2a45; --text: #e8edf7; --muted: #8b96b3; }
.screen[data-theme="light"] {
  --bg: #f5f2ea; --card: #ffffff; --card2: #f7f4ec; --border: #e6dfd0;
  --text: #1c1913; --muted: #645e50; --gold: #8f6a0e; --gold-soft: rgba(185, 138, 21, 0.12);
  --gold-grad: linear-gradient(135deg, #ecd28a 0%, #d3a52f 50%, #b98a15 100%);
  --gold-border: rgba(185, 138, 21, 0.32); --track: rgba(28, 25, 19, 0.09);
  --down: #d64545; --down-dim: rgba(214, 69, 69, 0.1);
  --card-shadow: 0 10px 26px -16px rgba(28, 25, 19, 0.28);
  --sheen: linear-gradient(180deg, rgba(255, 255, 255, 0.7), transparent 42%);
  --glow: radial-gradient(900px 420px at 50% -8%, rgba(201, 143, 27, 0.1), transparent 60%);
  --bg-gift-a: 0.5; --bg-gift-b: 0.22; --tile-gift: 0.55;
}
.screen { --k: 1; --ease: cubic-bezier(0.2, 0.8, 0.2, 1); --spring: cubic-bezier(0.3, 1.45, 0.5, 1); }
.screen.slow { --k: 3; }

/* ---------------- Панель концепта ---------------- */
.ctl { width: min(420px, 100%); display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.ctl button { padding: 7px 11px; border-radius: 10px; background: #151a22; border: 1px solid #263040; font-size: 12.5px; font-weight: 700; color: #b8c1d1; }
.ctl button.on { background: #e9b640; color: #221703; border-color: #e9b640; }
.ctl .sep { width: 100%; height: 0; }
.ctl .lbl { align-self: center; font-size: 12px; color: #7d8799; font-weight: 700; padding: 0 4px; }

/* ---------------- «Телефон» ---------------- */
.screen {
  width: min(400px, 100%); padding: 18px 14px 28px; border-radius: 30px;
  background: var(--glow), var(--bg); color: var(--text); border: 1px solid #1a1f29;
  display: flex; flex-direction: column; gap: 12px;
}
.screen h4 { font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; padding: 0 4px; }
.card { position: relative; border-radius: 22px; background: var(--sheen), var(--card); border: 1px solid var(--border); box-shadow: var(--card-shadow); }

/* ---------------- Карточка бонуса ---------------- */
.daily { padding: 14px 14px 12px; overflow: hidden; isolation: isolate; }

/* Фон: два подарка за шапкой, свечение и искры. */
.dl-bg { position: absolute; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; border-radius: inherit; }
.dl-bg::before {
  content: ""; position: absolute; right: -60px; top: -80px; width: 280px; height: 230px; border-radius: 50%;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--gold) 22%, transparent), transparent);
  animation: breath calc(var(--k) * 4s) ease-in-out infinite;
}
.dl-bg img { position: absolute; filter: blur(0.4px); }
.dl-bg .ga { width: 150px; right: -30px; top: -14px; opacity: var(--bg-gift-a); transform: rotate(16deg);
  -webkit-mask-image: linear-gradient(200deg, #000 45%, transparent 92%); mask-image: linear-gradient(200deg, #000 45%, transparent 92%);
  animation: drift calc(var(--k) * 9s) ease-in-out infinite; }
.dl-bg .gb { width: 104px; right: 104px; top: -44px; opacity: var(--bg-gift-b); transform: rotate(-14deg);
  -webkit-mask-image: linear-gradient(180deg, #000 20%, transparent 90%); mask-image: linear-gradient(180deg, #000 20%, transparent 90%);
  animation: drift calc(var(--k) * 11s) ease-in-out -3s infinite reverse; }
.dl-bg i { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 8px var(--gold);
  opacity: 0; animation: twinkle calc(var(--k) * 3.2s) ease-in-out infinite; animation-delay: calc(var(--k) * var(--t) * 1ms); }
.dl-bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 46%, var(--card) 78%); }

/* Шапка */
.dl-top { display: flex; align-items: center; gap: 12px; }
.dl-hero { position: relative; width: 64px; height: 64px; flex: none; display: grid; place-items: center; }
.dl-hero::before { content: ""; position: absolute; inset: 2px; border-radius: 50%;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--gold) 38%, transparent), transparent);
  animation: breath calc(var(--k) * 2.8s) ease-in-out infinite; }
.dl-hero img { position: relative; width: 60px; height: 60px; object-fit: contain; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.45)); transform-origin: 50% 90%; }
.dl-hero.idle img { animation: wiggle calc(var(--k) * 3.6s) ease-in-out 1s infinite; }
.dl-hero.open img { animation: giftOpen calc(var(--k) * 820ms) var(--spring) both; }
.dl-hero .rays { position: absolute; inset: -18px; border-radius: 50%; opacity: 0; pointer-events: none;
  background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--gold) 55%, transparent) 0 8deg, transparent 8deg 30deg);
  -webkit-mask-image: radial-gradient(closest-side, #000 30%, transparent); mask-image: radial-gradient(closest-side, #000 30%, transparent); }
.dl-hero.open .rays { animation: rays calc(var(--k) * 1.3s) ease-out; }
.dl-hero.done::before { animation: none; opacity: 0.25; }
.dl-hero.done img { filter: grayscale(0.35) brightness(0.85) drop-shadow(0 6px 10px rgba(0, 0, 0, 0.4)); }

.dl-t { flex: 1; min-width: 0; }
.dl-t > b { display: block; font-size: 16px; font-weight: 850; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dl-streak { display: inline-flex; align-items: center; gap: 5px; margin-top: 4px; padding: 3px 9px 3px 6px; border-radius: 99px;
  background: color-mix(in srgb, #ff8a3c 13%, transparent); font-size: 12px; font-weight: 800; color: var(--muted); white-space: nowrap; }
.dl-streak svg { width: 14px; height: 14px; color: #ff8a3c; flex: none; }
.dl-streak b { color: var(--text); }
.dl-streak.zero { background: var(--track); }
.dl-streak.zero svg { color: var(--muted); }
.dl-streak.flip { animation: flipIn calc(var(--k) * 520ms) var(--ease); }

.dl-amt { flex: none; text-align: right; }
.dl-amt b { display: block; font-size: 24px; font-weight: 900; color: var(--gold); letter-spacing: -0.03em; text-shadow: 0 0 18px color-mix(in srgb, var(--gold) 35%, transparent); }
.dl-amt span { font-size: 11px; font-weight: 750; color: var(--muted); }
.dl-amt.done b { color: var(--muted); text-shadow: none; }
.dl-amt.bump b { animation: bump calc(var(--k) * 480ms) var(--spring); }

/* Полоса серии до максимума */
.dl-prog { margin-top: 12px; }
.dl-prog-h { display: flex; justify-content: space-between; font-size: 11px; font-weight: 750; color: var(--muted); margin-bottom: 5px; }
.dl-prog-h b { color: var(--text); }
.dl-prog-h .mx { color: var(--gold); }
.dl-bar { display: grid; grid-template-columns: repeat(11, 1fr); gap: 3px; }
.dl-bar i { height: 5px; border-radius: 3px; background: var(--track); transition: background 0.4s; }
.dl-bar i.on { background: var(--gold-grad); }
.dl-bar i.next { background: color-mix(in srgb, var(--gold) 30%, var(--track)); animation: breath calc(var(--k) * 1.6s) ease-in-out infinite; }

/* Неделя */
.dl-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 12px; }
.wd {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0;
  padding: 7px 0 6px; border-radius: 13px; background: color-mix(in srgb, var(--card2) 88%, transparent); border: 1px solid var(--border);
  font-size: 11px; font-weight: 800; color: var(--muted); text-transform: lowercase;
}
.wd .g { position: relative; width: 34px; height: 34px; }
.wd .g img { width: 100%; height: 100%; object-fit: contain; opacity: var(--tile-gift); filter: grayscale(0.2); }
.wd .lock { position: absolute; top: 4px; right: 4px; width: 11px; height: 11px; color: var(--muted); opacity: 0.8; }
.wd .ck { position: absolute; left: 50%; top: 50%; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%;
  display: grid; place-items: center; background: var(--gold-grad); color: var(--primary-text); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35); }
.wd .ck svg { width: 12px; height: 12px; }
.wd b { font-size: 11px; font-weight: 850; white-space: nowrap; letter-spacing: -0.02em; }
.wd.got .g img { opacity: 0.45; filter: none; }
.wd.got b { color: var(--text); }
.wd.today { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 11%, var(--card2)); color: var(--gold);
  box-shadow: 0 0 0 3px var(--gold-soft), 0 8px 20px -10px color-mix(in srgb, var(--gold) 60%, transparent); }
.wd.today b { color: var(--gold); }
.wd.today:not(.got) .g img { opacity: 1; filter: drop-shadow(0 0 8px color-mix(in srgb, var(--gold) 60%, transparent)); animation: hop calc(var(--k) * 1.8s) ease-in-out infinite; }
.wd.today.got .g img { opacity: 0.55; }
.wd.stamp .ck { animation: stamp calc(var(--k) * 560ms) cubic-bezier(0.3, 1.5, 0.5, 1) both; }
.wd.in { animation: wdIn calc(var(--k) * 420ms) var(--spring) calc(var(--k) * var(--d, 0) * 1ms) backwards; }
.wd[data-max] { border-style: dashed; border-color: var(--gold-border); }
.wd[data-max]::before {
  content: attr(data-max); position: absolute; top: -7px; padding: 0 5px; border-radius: 99px;
  background: var(--gold-grad); color: var(--primary-text);
  font-size: 8.5px; font-weight: 900; letter-spacing: 0.05em; text-transform: uppercase;
}

/* Кнопка / таймер */
.dl-cta { margin-top: 12px; }
.btn { position: relative; width: 100%; height: 50px; border-radius: 15px; overflow: hidden;
  display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15.5px; font-weight: 850;
  background: var(--gold-grad); color: var(--primary-text);
  box-shadow: 0 10px 26px -10px rgba(233, 182, 64, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.35);
  transition: transform 0.14s var(--ease); }
.btn:active { transform: scale(0.97); }
.btn svg { width: 19px; height: 19px; }
.btn em { font-style: normal; padding: 2px 8px; border-radius: 99px; background: rgba(34, 23, 3, 0.14); font-variant-numeric: tabular-nums; }
.btn::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%;
  background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.45), transparent); animation: sweep calc(var(--k) * 3.2s) ease-in-out 1s infinite; }
.btn:disabled { opacity: 0.75; }
.cd { display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 12px; border-radius: 15px; background: var(--card2); border: 1px solid var(--border); }
.cd.in { animation: fadeUp calc(var(--k) * 460ms) var(--ease) both; }
.ring { width: 30px; height: 30px; flex: none; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 3.2; }
.ring .tr { stroke: var(--track); }
.ring .pr { stroke: var(--gold); stroke-linecap: round; stroke-dasharray: 100; transition: stroke-dashoffset 1s linear; }
.cd-t { flex: 1; min-width: 0; font-size: 12.5px; font-weight: 750; color: var(--muted); line-height: 1.3; }
.cd-t b { color: var(--text); }
.cd-t .g { color: var(--gold); }
.cd-amt { display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 850; color: var(--gold); }
.cd-amt img { width: 26px; height: 26px; object-fit: contain; }
.warn { display: flex; align-items: center; gap: 6px; margin-top: 8px; padding: 7px 10px; border-radius: 11px;
  background: var(--down-dim); color: var(--down); font-size: 12px; font-weight: 800; }
.warn svg { width: 14px; height: 14px; flex: none; }
.lost { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 12px; font-weight: 750; color: var(--muted); }
.lost b { color: var(--text); }

/* Монеты */
.coin { position: fixed; z-index: 50; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle at 35% 30%, #fff3c4, #f2c443 45%, #b8810f); box-shadow: 0 0 8px rgba(233, 182, 64, 0.7); }

/* ---------------- Анимации ---------------- */
@keyframes breath { 0%, 100% { opacity: 0.55; transform: scale(0.96); } 50% { opacity: 1; transform: scale(1.04); } }
@keyframes drift { 0%, 100% { translate: 0 0; } 50% { translate: -4px 5px; } }
@keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(0.4); } 50% { opacity: 0.9; transform: scale(1); } }
@keyframes wiggle { 0%, 70%, 100% { transform: rotate(0); } 74% { transform: rotate(-7deg); } 79% { transform: rotate(6deg); } 84% { transform: rotate(-4deg); } 89% { transform: rotate(2deg); } }
@keyframes hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
@keyframes giftOpen { 0% { transform: scale(1); } 25% { transform: scale(0.86, 1.08) rotate(-4deg); } 55% { transform: scale(1.18) translateY(-6px) rotate(3deg); } 100% { transform: scale(1); } }
@keyframes rays { 0% { opacity: 0; transform: scale(0.5) rotate(0); } 30% { opacity: 1; } 100% { opacity: 0; transform: scale(1.35) rotate(40deg); } }
@keyframes stamp { 0% { transform: scale(2.4); opacity: 0; } 60% { transform: scale(0.9); opacity: 1; } 100% { transform: scale(1); } }
@keyframes wdIn { from { opacity: 0; transform: translateY(8px) scale(0.92); } }
@keyframes flipIn { from { opacity: 0; transform: translateY(6px); } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } }
@keyframes bump { 40% { transform: scale(1.18); } }
@keyframes sweep { 0%, 55% { left: -60%; } 100% { left: 130%; } }
@media (prefers-reduced-motion: reduce) { .screen *, .screen *::before, .screen *::after { animation: none !important; } }
</style>
</head>
<body>
<div class="ctl" id="ctl">
  <span class="lbl">Состояние:</span>
  <button data-st="ready" class="on">Можно забрать</button>
  <button data-st="claimed">Уже забран</button>
  <button data-st="risk">Серия под угрозой</button>
  <button data-st="lost">Серия сгорела</button>
  <span class="sep"></span>
  <span class="lbl">Серия:</span>
  <button data-sk="-1">−</button><span class="lbl mono" id="sk">3</span><button data-sk="1">+</button>
  <span class="sep"></span>
  <button data-th="dark" class="on">Тёмная</button>
  <button data-th="midnight">Полночь</button>
  <button data-th="light">Светлая</button>
  <button id="slow">Замедлить</button>
</div>

<div class="screen" id="scr" data-theme="dark">
  <h4>Меню</h4>
  <section class="card daily" id="daily">
    <div class="dl-bg" aria-hidden="true">
      <img class="ga" alt="" data-img="gift-light">
      <img class="gb" alt="" data-img="gift-dark">
      <i style="right:38px;top:18px;--t:0"></i><i style="right:120px;top:52px;--t:900"></i>
      <i style="right:76px;top:86px;--t:1700"></i><i style="right:180px;top:20px;--t:2400"></i>
    </div>
    <div class="dl-top">
      <div class="dl-hero idle" id="hero"><span class="rays"></span><img alt="" data-img="gift-dark"></div>
      <div class="dl-t">
        <b>Ежедневный бонус</b>
        <span class="dl-streak" id="streak"></span>
      </div>
      <div class="dl-amt" id="amt"></div>
    </div>
    <div class="dl-prog" id="prog"></div>
    <div class="dl-week" id="week" role="list" aria-label="Серия ежедневного бонуса"></div>
    <div class="dl-cta" id="cta"></div>
  </section>
</div>

var BASE = 500, STEP = 100, MAXS = 11, MAX = BASE + (MAXS - 1) * STEP; // $1 500 на 11-й день
var $ = function (s) { return document.querySelector(s); };
var scr = $('#scr');
var S = { st: 'ready', streak: 3 };
var ICO = {
  flame: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 3.5-1.5 5-1.5 8 0 1.4 1 2.5 2.2 2.5 1.6 0 2.3-1.4 2-3.3C17.6 11 19 13.2 19 15.5 19 19.1 15.9 22 12 22s-7-2.9-7-6.5C5 10 10.5 8 12 2z"/></svg>',
  lock: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 10V8a5 5 0 0 1 10 0v2h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zm2 0h6V8a3 3 0 0 0-6 0z"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  gift: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><rect x="3.5" y="8" width="17" height="4.5" rx="1"/><path d="M5 12.5V20h14v-7.5M12 8v12M12 8S10.5 3.5 8 4.2C6 4.8 7 8 12 8zm0 0s1.5-4.5 4-3.8C18 4.8 17 8 12 8z"/></svg>',
  warn: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 1 21h22zm-1 7h2v6h-2zm0 8h2v2h-2z"/></svg>'
};
function money(v) { return '$' + Math.round(v).toLocaleString('ru-RU').replace(/\u00a0/g, '\u202f'); }
function amtFor(s) { return BASE + Math.max(0, Math.min(s, MAXS) - 1) * STEP; }
function plural(n, f) { var a = n % 10, b = n % 100; return a === 1 && b !== 11 ? f[0] : a >= 2 && a <= 4 && (b < 10 || b >= 20) ? f[1] : f[2]; }
function days(n) { return n + ' ' + plural(n, ['день', 'дня', 'дней']); }
function K() { return scr.classList.contains('slow') ? 3 : 1; }
document.querySelectorAll('[data-img]').forEach(function (i) { i.src = IMG[i.getAttribute('data-img')]; });

/* claimed — бонус сегодня уже получен; s — серия с учётом сегодняшнего дня. */
function model() {
  var claimed = S.st === 'claimed';
  var lost = S.st === 'lost';
  var prior = lost ? 0 : (claimed ? S.streak - 1 : S.streak);   // дней подряд до сегодня
  var todayS = prior + 1;                                       // какой по счёту день сегодня
  return { claimed: claimed, lost: lost, prior: prior, todayS: todayS, today: amtFor(todayS), shown: claimed ? S.streak : prior };
}

function render(mode) {
  var M = model();
  var hero = $('#hero');
  hero.classList.toggle('done', M.claimed);
  hero.classList.toggle('idle', !M.claimed);

  var sk = $('#streak');
  sk.className = 'dl-streak' + (M.shown ? '' : ' zero') + (mode === 'claim' ? ' flip' : '');
  sk.innerHTML = ICO.flame + (M.shown ? 'Серия <b>' + days(M.shown) + '</b>' : 'Забирай каждый день');

  var a = $('#amt');
  a.className = 'dl-amt' + (M.claimed ? ' done' : '') + (mode === 'claim' ? ' bump' : '');
  a.innerHTML = '<b class="mono">' + money(M.today) + '</b><span>' + (M.claimed ? 'получено' : 'сегодня') + '</span>';

  /* Полоса до максимума: 11 делений, закрашено — уже полученные дни. */
  var have = M.claimed ? M.todayS : M.prior, left = Math.max(0, MAXS - have);
  var bar = '';
  for (var i = 1; i <= MAXS; i++) bar += '<i class="' + (i <= have ? 'on' : (i === have + 1 ? 'next' : '')) + '"></i>';
  $('#prog').innerHTML = '<div class="dl-prog-h"><span>' + (left ? 'До максимума ещё <b>' + days(left) + '</b>' : 'Максимальный бонус каждый день') +
    '</span><span class="mx mono">макс ' + money(MAX) + '</span></div><div class="dl-bar">' + bar + '</div>';

  /* Неделя: −3 … +3 вокруг сегодня. */
  var now = new Date(), h = '', maxShown = M.today >= MAX;
  for (var o = -3; o <= 3; o++) {
    var got = o < 0 ? M.prior >= -o : (o === 0 && M.claimed);
    var s = M.todayS + o, amt = o < 0 ? (got ? amtFor(s) : BASE) : amtFor(s);
    var fut = o > 0, mx = '';
    if (fut && amt >= MAX && !maxShown) { mx = ' data-max="макс"'; maxShown = true; }
    var wd = new Date(now.getTime() + o * 864e5).toLocaleDateString('ru-RU', { weekday: 'short' }).replace('.', '');
    var cls = 'wd' + (got ? ' got' : '') + (o === 0 ? ' today' : '') + (o === 0 && mode === 'claim' ? ' stamp' : '') + (mode === 'intro' ? ' in' : '');
    var gimg = fut || (o < 0 && !got) ? IMG['gift-dark'] : IMG['gift-light'];
    h += '<div class="' + cls + '" role="listitem"' + mx + ' style="--d:' + (180 + (o + 3) * 55) + '"' + (o === 0 ? ' aria-current="date"' : '') + '>' +
      '<span>' + wd + '</span><span class="g"><img alt="" src="' + gimg + '">' + (got ? '<span class="ck">' + ICO.check + '</span>' : '') + '</span>' +
      '<b class="mono">' + money(amt) + '</b>' + (fut ? '<span class="lock">' + ICO.lock + '</span>' : '') + '</div>';
  }
  $('#week').innerHTML = h;

  /* Кнопка или таймер. */
  var cta = $('#cta');
  if (M.claimed) {
    cta.innerHTML = '<div class="cd' + (mode === 'claim' ? ' in' : '') + '">' +
      '<svg class="ring" viewBox="0 0 36 36"><circle class="tr" cx="18" cy="18" r="15.9"/><circle class="pr" id="ring" cx="18" cy="18" r="15.9" pathLength="100"/></svg>' +
      '<div class="cd-t">Следующий бонус через<br><b class="mono" id="cd">—</b></div>' +
      '<div class="cd-amt mono"><img alt="" src="' + IMG['gift-light'] + '">' + money(amtFor(M.todayS + 1)) + '</div></div>';
    tick();
  } else {
    cta.innerHTML = '<button type="button" class="btn" id="claim">' + ICO.gift + 'Забрать бонус <em>' + money(M.today) + '</em></button>' +
      (S.st === 'risk' ? '<div class="warn">' + ICO.warn + 'Серия ' + days(M.prior) + ' сгорит через <b class="mono">&nbsp;3:12:40</b></div>' : '') +
      (M.lost ? '<div class="lost">' + ICO.flame + 'Серия прервалась — начинаем заново с <b>' + money(BASE) + '</b></div>' : '');
    $('#claim').onclick = claim;
  }
}

function tick() {
  var cd = $('#cd'), ring = $('#ring');
  if (!cd) return;
  var n = new Date(), mid = new Date(n); mid.setHours(24, 0, 0, 0);
  var left = mid - n, p = (left / 864e5) * 100;
  var hh = Math.floor(left / 36e5), mm = Math.floor(left / 6e4) % 60, ss = Math.floor(left / 1e3) % 60;
  cd.textContent = hh + ':' + (mm < 10 ? '0' : '') + mm + ':' + (ss < 10 ? '0' : '') + ss;
  ring.style.strokeDashoffset = (100 - p).toFixed(2);
}
setInterval(tick, 1000);

/* Получение: подарок открывается, монеты летят из плитки «сегодня» к сумме, затем печать и таймер. */
function claim() {
  var btn = $('#claim');
  btn.disabled = true;
  var hero = $('#hero');
  hero.classList.remove('open'); void hero.offsetWidth; hero.classList.add('open');
  var from = document.querySelector('.wd.today .g').getBoundingClientRect();
  var to = $('#amt').getBoundingClientRect();
  var fx = from.left + from.width / 2, fy = from.top + from.height / 2, tx = to.right - 30, ty = to.top + 14;
  for (var i = 0; i < 14; i++) coin(fx, fy, tx, ty, i * 45 * K());
  var next = model().todayS;
  setTimeout(function () {
    S.st = 'claimed';
    S.streak = next;
    syncCtl();
    render('claim');
  }, (14 * 45 + 650) * K());
}
function coin(fx, fy, tx, ty, delay) {
  var c = document.createElement('i');
  c.className = 'coin';
  c.style.left = fx + 'px'; c.style.top = fy + 'px'; c.style.opacity = '0';
  document.body.appendChild(c);
  var mx = (fx + tx) / 2 + (Math.random() - 0.5) * 120, my = Math.min(fy, ty) - 60 - Math.random() * 60;
  c.animate([
    { transform: 'translate(0,0) scale(0.6)', opacity: 0 },
    { transform: 'translate(' + (mx - fx) + 'px,' + (my - fy) + 'px) scale(1.1)', opacity: 1, offset: 0.45 },
    { transform: 'translate(' + (tx - fx) + 'px,' + (ty - fy) + 'px) scale(0.5)', opacity: 0.2 }
  ], { duration: 650 * K(), delay: delay, easing: 'cubic-bezier(.5,0,.4,1)', fill: 'forwards' }).onfinish = function () { c.remove(); };
}

/* Панель концепта */
function syncCtl() {
  document.querySelectorAll('[data-st]').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-st') === S.st); });
  $('#sk').textContent = S.streak;
}
$('#ctl').addEventListener('click', function (e) {
  var b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.st) { S.st = b.dataset.st; if (S.st === 'claimed' && S.streak < 1) S.streak = 1; if (S.st === 'risk' && S.streak < 1) S.streak = 3; }
  if (b.dataset.sk) S.streak = Math.max(S.st === 'claimed' ? 1 : 0, Math.min(14, S.streak + +b.dataset.sk));
  if (b.dataset.th) { scr.setAttribute('data-theme', b.dataset.th); document.querySelectorAll('[data-th]').forEach(function (x) { x.classList.toggle('on', x === b); }); }
  if (b.id === 'slow') { scr.classList.toggle('slow'); b.classList.toggle('on'); }
  syncCtl();
  render('intro');
});
syncCtl();
render('intro');
</script>
